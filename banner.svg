<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#161B33"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" x2="1">
      <stop offset="0" stop-color="#EA4B71" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#EA4B71" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#EA4B71" stop-opacity="0.15"/>
    </linearGradient>
    <style>
      .flow { stroke-dasharray: 6 10; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -32; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .pulse.d2 { animation-delay: .8s; } .pulse.d3 { animation-delay: 1.6s; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>

  <!-- node graph on the right -->
  <g fill="none" stroke="url(#wire)" stroke-width="2">
    <path class="flow" d="M760 90 C 820 90, 820 150, 880 150"/>
    <path class="flow" d="M760 210 C 820 210, 820 150, 880 150"/>
    <path class="flow" d="M940 150 C 990 150, 990 95, 1040 95"/>
    <path class="flow" d="M940 150 C 990 150, 990 205, 1040 205"/>
  </g>
  <g stroke="#EA4B71" stroke-width="2" fill="#11172B">
    <rect x="700" y="68" width="60" height="44" rx="10" class="pulse"/>
    <rect x="700" y="188" width="60" height="44" rx="10" class="pulse d2"/>
    <rect x="880" y="124" width="60" height="52" rx="12" class="pulse d3"/>
    <rect x="1040" y="73" width="60" height="44" rx="10" class="pulse d2"/>
    <rect x="1040" y="183" width="60" height="44" rx="10" class="pulse"/>
  </g>
  <g fill="#C9D1E4" font-size="11" text-anchor="middle">
    <text x="730" y="94">LEADS</text>
    <text x="730" y="214">ENRICH</text>
    <text x="910" y="154" fill="#EA4B71" font-weight="700">n8n + AI</text>
    <text x="1070" y="99">CRM</text>
    <text x="1070" y="209">OUTREACH</text>
  </g>

  <!-- title -->
  <text x="70" y="130" font-size="54" font-weight="700" fill="#FFFFFF">Omar Khandaker</text>
  <text x="72" y="178" font-size="26" fill="#EA4B71" font-weight="600">GTM Engineer</text>
  <text x="72" y="220" font-size="18" fill="#8B93A8">Automating go-to-market with n8n + AI</text>
</svg>
